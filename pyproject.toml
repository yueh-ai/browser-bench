[project]
name = "browser-bench"
version = "0.1.0"
description = "Head-to-head benchmark comparing browser automation CLIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
browser-bench-judge = "browser_bench.judge:main"
browser-bench-report = "browser_bench.report:main"
browser-bench-aggregate = "browser_bench.aggregate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_bench"]

[tool.hatch.build.targets.wheel.shared-data]
"src/browser_bench/templates" = "browser_bench/templates"
